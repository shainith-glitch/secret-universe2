<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secret Universe</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #000;
    color: white;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

canvas {
    display: block;
}

.title {
    position: fixed;
    top: 20px;
    width: 100%;
    text-align: center;
    font-size: 28px;
    letter-spacing: 5px;
    text-shadow: 0 0 15px #4caaff;
    pointer-events: none;
}

.info {
    position: fixed;
    bottom: 35px;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    width: 90%;
}

.info h2 {
    font-size: 25px;
    color: #65caff;
    margin-bottom: 8px;
}

.info p {
    font-size: 14px;
    color: #ccc;
}

button {
    margin-top: 15px;
    padding: 12px 25px;
    border: 1px solid #42baff;
    border-radius: 25px;
    color: white;
    background: #07152e;
    font-size: 15px;
}

button:active {
    background: #174d88;
}

#loading {
    position: fixed;
    top: 50%;
    width: 100%;
    text-align: center;
    color: #6dcaff;
}
</style>
</head>

<body>

<div class="title">SECRET UNIVERSE</div>
<div id="loading">Entering the universe...</div>

<div class="info">
    <h2 id="planetName">SOLAR SYSTEM</h2>
    <p id="description">
        Welcome to your universe. Touch a planet to discover it.
    </p>
    <button onclick="resetView()">RESET UNIVERSE</button>
</div>

<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x000008);

const camera = new THREE.PerspectiveCamera(
    60,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
);

camera.position.set(0, 8, 23);

const renderer = new THREE.WebGLRenderer({
    antialias: true
});

renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

// LIGHTS
const sunlight = new THREE.PointLight(0xffffff, 180, 100);
sunlight.position.set(0, 0, 0);
scene.add(sunlight);

scene.add(new THREE.AmbientLight(0xffffff, 0.5));

// SUN
const sun = new THREE.Mesh(
    new THREE.SphereGeometry(2, 48, 48),
    new THREE.MeshBasicMaterial({color: 0xffaa00})
);

scene.add(sun);

// SUN GLOW
const glow = new THREE.Mesh(
    new THREE.SphereGeometry(2.5, 32, 32),
    new THREE.MeshBasicMaterial({
        color: 0xff6600,
        transparent: true,
        opacity: 0.15
    })
);

scene.add(glow);

// PLANETS
const planets = [];

const data = [
    {name:"MERCURY", color:0xaaaaaa, size:0.35, x:4, description:"Mercury is the closest planet to the Sun."},
    {name:"VENUS", color:0xffbb66, size:0.55, x:6, description:"Venus is one of the hottest planets."},
    {name:"EARTH", color:0x1677ff, size:0.65, x:9, description:"Earth is our beautiful home planet."},
    {name:"MARS", color:0xff4422, size:0.48, x:12, description:"Mars is known as the Red Planet."},
    {name:"JUPITER", color:0xddaa77, size:1.3, x:16, description:"Jupiter is the largest planet."},
    {name:"SATURN", color:0xeedd99, size:1.1, x:21, description:"Saturn is famous for its rings."}
];

data.forEach((item, index) => {

    const planet = new THREE.Mesh(
        new THREE.SphereGeometry(item.size, 32, 32),
        new THREE.MeshStandardMaterial({
            color:item.color,
            roughness:0.8
        })
    );

    planet.position.set(item.x, 0, 0);
    planet.userData = item;

    scene.add(planet);
    planets.push(planet);

    // SATURN RINGS
    if(item.name === "SATURN") {
        const ring = new THREE.Mesh(
            new THREE.RingGeometry(1.4, 2, 64),
            new THREE.MeshBasicMaterial({
                color:0xcbb58a,
                side:THREE.DoubleSide
            })
        );

        ring.rotation.x = Math.PI / 2.5;
        planet.add(ring);
    }
});

// STARS
const starGeometry = new THREE.BufferGeometry();
const starPositions = [];

for(let i = 0; i < 2500; i++) {
    starPositions.push(
        (Math.random()-0.5)*200,
        (Math.random()-0.5)*120,
        (Math.random()-0.5)*150
    );
}

starGeometry.setAttribute(
    'position',
    new THREE.Float32BufferAttribute(starPositions, 3)
);

const stars = new THREE.Points(
    starGeometry,
    new THREE.PointsMaterial({
        color:0xffffff,
        size:0.15
    })
);

scene.add(stars);

// INTERACTION
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();

function selectPlanet(event) {

    const rect = renderer.domElement.getBoundingClientRect();

    pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
    pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

    raycaster.setFromCamera(pointer, camera);

    const hits = raycaster.intersectObjects(planets);

    if(hits.length > 0) {
        const selected = hits[0].object.userData;

        document.getElementById("planetName").textContent = selected.name;

        document.getElementById("description").textContent =
            selected.description;
    }
}

renderer.domElement.addEventListener("pointerdown", selectPlanet);

// MOBILE TOUCH MOVEMENT
let dragging = false;
let previousX = 0;
let previousY = 0;

renderer.domElement.addEventListener("pointerdown", event => {
    dragging = true;
    previousX = event.clientX;
    previousY = event.clientY;
});

window.addEventListener("pointerup", () => dragging = false);

window.addEventListener("pointermove", event => {

    if(!dragging) return;

    const dx = event.clientX - previousX;
    const dy = event.clientY - previousY;

    scene.rotation.y += dx * 0.003;
    scene.rotation.x += dy * 0.003;

    previousX = event.clientX;
    previousY = event.clientY;
});

function resetView() {
    scene.rotation.set(0,0,0);
    camera.position.set(0,8,23);
    camera.lookAt(0,0,0);

    document.getElementById("planetName").textContent = "SOLAR SYSTEM";
    document.getElementById("description").textContent =
        "Welcome to your universe. Touch a planet to discover it.";
}

window.resetView = resetView;

// ANIMATION
function animate() {
    requestAnimationFrame(animate);

    sun.rotation.y += 0.002;

    planets.forEach((planet, index) => {
        planet.rotation.y += 0.008;
    });

    stars.rotation.y += 0.0001;

    renderer.render(scene, camera);
}

animate();

document.getElementById("loading").style.display = "none";

// SCREEN RESIZE
window.addEventListener("resize", () => {

    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();

    renderer.setSize(window.innerWidth, window.innerHeight);
});

</script>

</body>
</html>
