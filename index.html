<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ultra Realistic Universe</title>

<style>
body {
    margin: 0;
    overflow: hidden;
    background: #000;
    color: white;
    font-family: Arial;
}

h1 {
    position: fixed;
    top: 10px;
    width: 100%;
    text-align: center;
    color: #b8dfff;
    text-shadow: 0 0 15px #168cff;
    pointer-events: none;
}

#info {
    position: fixed;
    top: 75px;
    left: 15px;
    background: #061329dd;
    border: 1px solid #399cff;
    border-radius: 12px;
    padding: 15px;
    width: 200px;
    display: none;
}

button {
    background: #102e56;
    color: white;
    border: 1px solid #559fff;
    padding: 10px 14px;
    border-radius: 20px;
    margin: 4px;
    cursor: pointer;
}

#controls {
    position: fixed;
    bottom: 15px;
    width: 100%;
    text-align: center;
}

#loading {
    position: fixed;
    top: 50%;
    width: 100%;
    text-align: center;
    color: #8fcaff;
}
</style>
</head>

<body>

<h1>ULTRA REALISTIC UNIVERSE</h1>

<div id="loading">Preparing your universe...</div>

<div id="info">
    <h3 id="planetName"></h3>
    <p id="planetDescription"></p>
    <button onclick="document.getElementById('info').style.display='none'">
        Close
    </button>
</div>

<div id="controls">
    <button onclick="startTour()">🚀 Space Tour</button>
    <button onclick="resetView()">Reset View</button>
</div>

<script type="module">

import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

// SCENE
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000008);

// CAMERA
const camera = new THREE.PerspectiveCamera(
    60,
    window.innerWidth / window.innerHeight,
    0.1,
    2000
);

camera.position.set(0, 35, 85);

// RENDERER
const renderer = new THREE.WebGLRenderer({
    antialias: true
});

renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;

document.body.appendChild(renderer.domElement);

// LIGHT
scene.add(new THREE.AmbientLight(0xffffff, 0.18));

const sunLight = new THREE.PointLight(0xffffff, 180, 500);
scene.add(sunLight);

// TEXTURE LOADER
const loader = new THREE.TextureLoader();

function loadTexture(name) {
    const texture = loader.load(
        'https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/textures/planets/' + name
    );

    texture.colorSpace = THREE.SRGBColorSpace;
    return texture;
}

// STARFIELD
const starPositions = [];

for(let i = 0; i < 5000; i++) {
    starPositions.push(
        (Math.random() - 0.5) * 600,
        (Math.random() - 0.5) * 400,
        (Math.random() - 0.5) * 600
    );
}

const starGeometry = new THREE.BufferGeometry();

starGeometry.setAttribute(
    'position',
    new THREE.Float32BufferAttribute(starPositions, 3)
);

const stars = new THREE.Points(
    starGeometry,
    new THREE.PointsMaterial({
        color: 0xffffff,
        size: 0.6
    })
);

scene.add(stars);

// SUN
const sun = new THREE.Mesh(
    new THREE.SphereGeometry(5, 64, 64),
    new THREE.MeshBasicMaterial({
        map: loadTexture('sun.jpg')
    })
);

scene.add(sun);

const sunGlow = new THREE.Sprite(
    new THREE.SpriteMaterial({
        map: createGlow(),
        color: 0xffaa44,
        transparent: true,
        blending: THREE.AdditiveBlending
    })
);

sunGlow.scale.set(22, 22, 1);
scene.add(sunGlow);

function createGlow() {
    const canvas = document.createElement('canvas');
    canvas.width = 128;
    canvas.height = 128;

    const ctx = canvas.getContext('2d');
    const gradient = ctx.createRadialGradient(64,64,2,64,64,64);

    gradient.addColorStop(0,'rgba(255,220,120,0.8)');
    gradient.addColorStop(0.3,'rgba(255,130,20,0.3)');
    gradient.addColorStop(1,'rgba(255,100,0,0)');

    ctx.fillStyle = gradient;
    ctx.fillRect(0,0,128,128);

    return new THREE.CanvasTexture(canvas);
}

// PLANETS
const planets = [];

const planetData = [
    ['Mercury','mercury.jpg',7,0.8,'The smallest planet in our solar system.'],
    ['Venus','venus_surface.jpg',11,1.3,'A very hot planet with a thick atmosphere.'],
    ['Earth','earth_atmos_2048.jpg',16,1.5,'Our home planet, with oceans and continents.'],
    ['Mars','mars_1k_color.jpg',22,1.1,'The red planet.'],
    ['Jupiter','jupiter.jpg',31,3.5,'The largest planet in our solar system.'],
    ['Saturn','saturn.jpg',42,3,'Famous for its spectacular rings.'],
    ['Uranus','uranus.jpg',52,2.1,'An ice giant that rotates on its side.'],
    ['Neptune','neptune.jpg',62,2.1,'A distant blue ice giant.']
];

planetData.forEach((data,index) => {

    const [name,texture,distance,size,description] = data;

    const group = new THREE.Group();
    scene.add(group);

    const planet = new THREE.Mesh(
        new THREE.SphereGeometry(size,64,64),
        new THREE.MeshStandardMaterial({
            map: loadTexture(texture),
            roughness: 0.9
        })
    );

    planet.position.x = distance;
    group.add(planet);

    planet.userData = {name,description};

    // EARTH CLOUDS
    if(name === 'Earth') {
        const clouds = new THREE.Mesh(
            new THREE.SphereGeometry(size*1.015,64,64),
            new THREE.MeshStandardMaterial({
                map: loadTexture('earth_clouds_1024.png'),
                transparent: true,
                opacity: 0.55,
                depthWrite: false
            })
        );

        clouds.position.copy(planet.position);
        group.add(clouds);
        planet.userData.clouds = clouds;
    }

    // SATURN RINGS
    if(name === 'Saturn') {
        const ring = new THREE.Mesh(
            new THREE.RingGeometry(size*1.3,size*2.3,128),
            new THREE.MeshStandardMaterial({
                color: 0xc5aa83,
                side: THREE.DoubleSide,
                transparent: true,
                opacity: 0.85
            })
        );

        ring.rotation.x = -Math.PI/2.5;
        ring.position.copy(planet.position);
        group.add(ring);
    }

    // ORBIT
    const orbit = new THREE.Mesh(
        new THREE.RingGeometry(distance-0.04,distance+0.04,128),
        new THREE.MeshBasicMaterial({
            color: 0x33445c,
            side: THREE.DoubleSide
        })
    );

    orbit.rotation.x = -Math.PI/2;
    scene.add(orbit);

    planets.push({group,planet,index});
});

// EARTH MOON
const moon = new THREE.Mesh(
    new THREE.SphereGeometry(0.5,48,48),
    new THREE.MeshStandardMaterial({
        map: loadTexture('moon_1024.jpg')
    })
);

scene.add(moon);

// SHOOTING STARS
const shootingStars = [];

for(let i=0;i<12;i++) {
    const star = new THREE.Mesh(
        new THREE.SphereGeometry(0.12,8,8),
        new THREE.MeshBasicMaterial({color:0xffffff})
    );

    star.position.set(
        Math.random()*100-50,
        Math.random()*50,
        Math.random()*100-50
    );

    scene.add(star);
    shootingStars.push(star);
}

// SPACESHIP
const ship = new THREE.Group();

const shipBody = new THREE.Mesh(
    new THREE.ConeGeometry(0.8,3.5,16),
    new THREE.MeshStandardMaterial({
        color:0xc5d8ed,
        metalness:0.8,
        roughness:0.25
    })
);

shipBody.rotation.x = Math.PI/2;
ship.add(shipBody);

ship.position.set(0,5,12);
scene.add(ship);

// PLANET INFORMATION
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();

renderer.domElement.addEventListener('click',event => {

    pointer.x = event.clientX/window.innerWidth*2-1;
    pointer.y = -(event.clientY/window.innerHeight)*2+1;

    raycaster.setFromCamera(pointer,camera);

    const hits = raycaster.intersectObjects(
        planets.map(p => p.planet)
    );

    if(hits.length) {
        const data = hits[0].object.userData;

        document.getElementById('planetName').textContent = data.name;
        document.getElementById('planetDescription').textContent = data.description;
        document.getElementById('info').style.display = 'block';
    }
});

// CAMERA DRAG
let dragging = false;
let previousX = 0;
let previousY = 0;

renderer.domElement.addEventListener('pointerdown',e => {
    dragging = true;
    previousX = e.clientX;
    previousY = e.clientY;
});

window.addEventListener('pointerup',() => dragging = false);

renderer.domElement.addEventListener('pointermove',e => {
    if(!dragging) return;

    scene.rotation.y += (e.clientX-previousX)*0.003;
    scene.rotation.x += (e.clientY-previousY)*0.003;

    previousX = e.clientX;
    previousY = e.clientY;
});

// ZOOM
renderer.domElement.addEventListener('wheel',e => {
    camera.position.z += e.deltaY*0.04;
    camera.position.z = THREE.MathUtils.clamp(camera.position.z,12,150);
});

// TOUR
let touring = false;

window.startTour = function() {
    touring = true;
};

window.resetView = function() {
    touring = false;
    camera.position.set(0,35,85);
    camera.lookAt(0,0,0);
    scene.rotation.set(0,0,0);
};

// ANIMATION
function animate() {

    requestAnimationFrame(animate);

    sun.rotation.y += 0.001;

    planets.forEach(p => {
        p.group.rotation.y += 0.001;
        p.planet.rotation.y += 0.003;

        if(p.planet.userData.clouds) {
            p.planet.userData.clouds.rotation.y += 0.0005;
        }
    });

    // MOON ORBIT
    const earth = planets[2].planet;
    const earthPosition = new THREE.Vector3();
    earth.getWorldPosition(earthPosition);

    const time = Date.now()*0.0005;

    moon.position.set(
        earthPosition.x + Math.cos(time)*3,
        earthPosition.y,
        earthPosition.z + Math.sin(time)*3
    );

    // SHOOTING STARS
    shootingStars.forEach(star => {
        star.position.x -= 0.25;
        star.position.y -= 0.1;

        if(star.position.x < -70) {
            star.position.x = 70;
            star.position.y = Math.random()*50;
        }
    });

    ship.rotation.y += 0.002;

    if(touring) {
        camera.position.x = Math.sin(Date.now()*0.0002)*50;
        camera.position.z = 85;
        camera.lookAt(0,0,0);
    }

    renderer.render(scene,camera);
}

animate();

document.getElementById('loading').style.display = 'none';

// RESIZE
window.addEventListener('resize',() => {
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth,window.innerHeight);
});

</script>
</body>
</html>
