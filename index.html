<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secret Universe</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    overflow: hidden;
    background: #02010c;
    color: white;
    font-family: Arial, sans-serif;
}

#universe {
    position: fixed;
    inset: 0;
}

h1 {
    position: fixed;
    top: 10px;
    width: 100%;
    text-align: center;
    color: #d9c5ff;
    text-shadow: 0 0 15px #9b5cff;
    pointer-events: none;
}

#info {
    position: fixed;
    top: 85px;
    left: 15px;
    max-width: 230px;
    padding: 14px;
    border: 1px solid #9b70ff;
    border-radius: 12px;
    background: #100b29dd;
    display: none;
}

button {
    border: 1px solid #b69aff;
    background: #25134d;
    color: white;
    padding: 10px 14px;
    border-radius: 20px;
    cursor: pointer;
    margin: 4px;
}

#controls {
    position: fixed;
    bottom: 15px;
    left: 0;
    right: 0;
    text-align: center;
}

#move {
    position: fixed;
    right: 12px;
    bottom: 100px;
    display: grid;
    grid-template-columns: repeat(3, 45px);
    gap: 4px;
}

#move button {
    padding: 12px 5px;
    margin: 0;
}

#help {
    position: fixed;
    bottom: 75px;
    left: 12px;
    font-size: 12px;
    color: #d8caff;
}
</style>
</head>

<body>

<div id="universe"></div>

<h1>🌌 SECRET UNIVERSE 🌌</h1>

<div id="info">
    <h3 id="planetName">Planet</h3>
    <p id="planetText"></p>
    <button onclick="closeInfo()">Close</button>
</div>

<div id="help">Drag to explore • Tap a planet to learn</div>

<div id="move">
    <span></span>
    <button onclick="moveShip(0,1)">⬆️</button>
    <span></span>
    <button onclick="moveShip(-1,0)">⬅️</button>
    <button onclick="moveShip(0,-1)">⬇️</button>
    <button onclick="moveShip(1,0)">➡️</button>
</div>

<div id="controls">
    <button onclick="startTour()">🚀 Start Tour</button>
    <button onclick="resetView()">🌍 Reset View</button>
</div>

<script type="module">

import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x02010c);

const camera = new THREE.PerspectiveCamera(
    60, window.innerWidth / window.innerHeight, 0.1, 2000
);

camera.position.set(0, 35, 75);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.getElementById("universe").appendChild(renderer.domElement);

// LIGHTS
scene.add(new THREE.AmbientLight(0xffffff, 1.4));

const sunLight = new THREE.PointLight(0xffffff, 3, 500);
scene.add(sunLight);

// SUN
const sun = new THREE.Mesh(
    new THREE.SphereGeometry(4, 48, 48),
    new THREE.MeshBasicMaterial({color: 0xffaa22})
);
scene.add(sun);

const sunGlow = new THREE.PointLight(0xffaa44, 3, 100);
scene.add(sunGlow);

// STARFIELD
const starGeometry = new THREE.BufferGeometry();
const starPositions = [];

for(let i=0;i<2500;i++){
    starPositions.push(
        (Math.random()-0.5)*500,
        (Math.random()-0.5)*300,
        (Math.random()-0.5)*500
    );
}

starGeometry.setAttribute(
    'position',
    new THREE.Float32BufferAttribute(starPositions,3)
);

const stars = new THREE.Points(
    starGeometry,
    new THREE.PointsMaterial({color:0xffffff,size:0.7})
);

scene.add(stars);

// MILKY WAY GALAXY
const galaxyGeometry = new THREE.BufferGeometry();
const galaxyPositions = [];
const galaxyColors = [];

for(let i=0;i<7000;i++){
    const arm = Math.floor(Math.random()*4);
    const radius = 8 + Math.random()*65;
    const angle = radius*0.12 + arm*Math.PI/2 +
                  (Math.random()-0.5)*0.5;

    galaxyPositions.push(
        Math.cos(angle)*radius,
        (Math.random()-0.5)*5,
        Math.sin(angle)*radius
    );

    galaxyColors.push(0.6+Math.random()*0.4,
                      0.3+Math.random()*0.5,1);
}

galaxyGeometry.setAttribute(
    'position',
    new THREE.Float32BufferAttribute(galaxyPositions,3)
);

galaxyGeometry.setAttribute(
    'color',
    new THREE.Float32BufferAttribute(galaxyColors,3)
);

const galaxy = new THREE.Points(
    galaxyGeometry,
    new THREE.PointsMaterial({
        size:0.45,
        vertexColors:true,
        transparent:true,
        opacity:0.8
    })
);

galaxy.position.set(0,-45,-90);
scene.add(galaxy);

// PLANETS
const planets = [];
const planetData = [
    ["Mercury",0xaaa9a5,7,0.7,"The smallest planet in our solar system."],
    ["Venus",0xe6ad69,10,1.1,"Venus is the hottest planet."],
    ["Earth",0x2288ff,14,1.2,"Our beautiful home planet."],
    ["Mars",0xe65b36,18,0.9,"Mars is known as the Red Planet."],
    ["Jupiter",0xd9a46c,25,3.1,"Jupiter is the largest planet."],
    ["Saturn",0xe5cf9a,34,2.6,"Saturn is famous for its beautiful rings."],
    ["Uranus",0x79d9dc,43,1.8,"Uranus rotates on its side."],
    ["Neptune",0x315bea,52,1.8,"Neptune is a distant blue planet."]
];

planetData.forEach((data,index)=>{
    const [name,color,distance,size,description] = data;

    const group = new THREE.Group();
    scene.add(group);

    const planet = new THREE.Mesh(
        new THREE.SphereGeometry(size,32,32),
        new THREE.MeshStandardMaterial({
            color:color,
            roughness:0.8
        })
    );

    planet.position.x = distance;
    group.add(planet);

    planet.userData = {name,description};

    // SATURN RINGS
    if(name==="Saturn"){
        const ring = new THREE.Mesh(
            new THREE.RingGeometry(3.2,5.2,80),
            new THREE.MeshBasicMaterial({
                color:0xd9c19a,
                side:THREE.DoubleSide
            })
        );

        ring.rotation.x = -Math.PI/2.5;
        planet.add(ring);
    }

    // ORBIT PATH
    const orbit = new THREE.Mesh(
        new THREE.RingGeometry(distance-0.04,distance+0.04,128),
        new THREE.MeshBasicMaterial({
            color:0x514477,
            side:THREE.DoubleSide
        })
    );

    orbit.rotation.x = -Math.PI/2;
    scene.add(orbit);

    planets.push({group,planet,index});
});

// SHOOTING STARS
const shootingStars = [];

for(let i=0;i<8;i++){
    const star = new THREE.Mesh(
        new THREE.SphereGeometry(0.18,8,8),
        new THREE.MeshBasicMaterial({color:0xffffff})
    );

    star.position.set(
        (Math.random()-0.5)*120,
        Math.random()*60,
        (Math.random()-0.5)*120
    );

    scene.add(star);
    shootingStars.push(star);
}

// SPACESHIP
const ship = new THREE.Group();

const body = new THREE.Mesh(
    new THREE.ConeGeometry(1,4,12),
    new THREE.MeshStandardMaterial({
        color:0xc9d9ff,
        metalness:0.7,
        roughness:0.3
    })
);

body.rotation.x = Math.PI/2;
ship.add(body);

const wing = new THREE.Mesh(
    new THREE.BoxGeometry(4,0.2,1),
    new THREE.MeshStandardMaterial({color:0x7855ff})
);

ship.add(wing);

const flame = new THREE.Mesh(
    new THREE.ConeGeometry(0.5,2,12),
    new THREE.MeshBasicMaterial({color:0xff6600})
);

flame.position.z = 2.5;
flame.rotation.x = -Math.PI/2;
ship.add(flame);

ship.position.set(0,4,10);
scene.add(ship);

// MOVE SPACESHIP
window.moveShip = function(x,z){
    ship.position.x += x*2;
    ship.position.z -= z*2;
};

// PLANET INFORMATION
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();

renderer.domElement.addEventListener("click",(event)=>{
    pointer.x = (event.clientX/window.innerWidth)*2-1;
    pointer.y = -(event.clientY/window.innerHeight)*2+1;

    raycaster.setFromCamera(pointer,camera);

    const hits = raycaster.intersectObjects(
        planets.map(p=>p.planet)
    );

    if(hits.length){
        const data = hits[0].object.userData;

        document.getElementById("planetName").textContent=data.name;
        document.getElementById("planetText").textContent=data.description;
        document.getElementById("info").style.display="block";
    }
});

window.closeInfo = function(){
    document.getElementById("info").style.display="none";
};

// CAMERA DRAG
let dragging=false;
let lastX=0;
let lastY=0;

renderer.domElement.addEventListener("pointerdown",e=>{
    dragging=true;
    lastX=e.clientX;
    lastY=e.clientY;
});

window.addEventListener("pointerup",()=>dragging=false);

renderer.domElement.addEventListener("pointermove",e=>{
    if(!dragging)return;

    const dx=e.clientX-lastX;
    const dy=e.clientY-lastY;

    scene.rotation.y += dx*0.003;
    scene.rotation.x += dy*0.003;

    lastX=e.clientX;
    lastY=e.clientY;
});

// ZOOM
renderer.domElement.addEventListener("wheel",e=>{
    camera.position.z += e.deltaY*0.04;
    camera.position.z = THREE.MathUtils.clamp(
        camera.position.z,12,150
    );
});

// TOUR
let touring=false;

window.startTour=function(){
    touring=true;
};

window.resetView=function(){
    touring=false;
    camera.position.set(0,35,75);
    camera.lookAt(0,0,0);
    scene.rotation.set(0,0,0);
};

// ANIMATION
function animate(){
    requestAnimationFrame(animate);

    planets.forEach((p,i)=>{
        p.group.rotation.y += 0.0015 + i*0.0002;
        p.planet.rotation.y += 0.01;
    });

    sun.rotation.y += 0.002;
    galaxy.rotation.y += 0.0005;

    ship.rotation.y += 0.003;
    flame.scale.y = 0.8 + Math.random()*0.5;

    shootingStars.forEach(star=>{
        star.position.x -= 0.35;
        star.position.y -= 0.12;

        if(star.position.x < -70){
            star.position.x=70;
            star.position.y=Math.random()*60;
        }
    });

    if(touring){
        camera.position.x += (Math.sin(Date.now()*0.0002)*45-camera.position.x)*0.005;
        camera.position.z += (65-camera.position.z)*0.005;
        camera.lookAt(0,0,0);
    }

    renderer.render(scene,camera);
}

animate();

// RESIZE
window.addEventListener("resize",()=>{
    camera.aspect=window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth,window.innerHeight);
});

</script>
</body>
</html>
