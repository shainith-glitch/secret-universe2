<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Secret Universe</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    overflow: hidden;
    background: #000;
    color: white;
    font-family: Arial, sans-serif;
}

canvas {
    display: block;
    touch-action: none;
}

h1 {
    position: fixed;
    top: 8px;
    left: 0;
    width: 100%;
    text-align: center;
    color: #c9e8ff;
    text-shadow: 0 0 18px #168cff;
    font-size: clamp(18px, 4vw, 30px);
    pointer-events: none;
    z-index: 2;
}

#loading {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    background: #02010c;
    z-index: 10;
    color: #a9dfff;
}

#info {
    position: fixed;
    top: 65px;
    left: 12px;
    width: 210px;
    padding: 12px;
    background: #061329e8;
    border: 1px solid #438dff;
    border-radius: 14px;
    display: none;
    z-index: 3;
}

button {
    background: #102e56;
    color: white;
    border: 1px solid #559fff;
    padding: 10px 13px;
    border-radius: 18px;
    cursor: pointer;
    font-size: 13px;
    touch-action: manipulation;
}

button:active {
    background: #2865a8;
}

#bottomControls {
    position: fixed;
    bottom: 12px;
    left: 0;
    width: 100%;
    text-align: center;
    z-index: 3;
}

#joystick {
    position: fixed;
    right: 15px;
    bottom: 95px;
    display: grid;
    grid-template-columns: repeat(3, 44px);
    gap: 5px;
    z-index: 3;
}

#joystick button {
    padding: 12px 3px;
    font-size: 17px;
}

#help {
    position: fixed;
    bottom: 75px;
    left: 12px;
    color: #c9dfff;
    font-size: 11px;
    z-index: 2;
}

@media(max-width:600px) {
    #info {
        width: 175px;
        font-size: 12px;
    }

    #bottomControls button {
        padding: 9px;
        font-size: 11px;
    }

    #joystick {
        bottom: 100px;
    }
}
</style>
</head>

<body>

<div id="loading">🌌 Preparing your universe...</div>

<h1>🌌 SECRET UNIVERSE 🌌</h1>

<div id="info">
    <h3 id="planetName">Planet</h3>
    <p id="planetDescription"></p>
    <button onclick="closeInfo()">Close</button>
</div>

<div id="help">
    Drag to rotate • Pinch to zoom • Tap a planet
</div>

<div id="joystick">
    <span></span>
    <button onclick="moveShip(0,1)">⬆️</button>
    <span></span>

    <button onclick="moveShip(-1,0)">⬅️</button>
    <button onclick="moveShip(0,-1)">⬇️</button>
    <button onclick="moveShip(1,0)">➡️</button>
</div>

<div id="bottomControls">
    <button onclick="startTour()">🚀 Space Tour</button>
    <button onclick="resetView()">🌍 Reset</button>
    <button onclick="toggleShip()">🛸 Ship</button>
</div>

<script type="module">

import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

// --------------------------------
// SCENE
// --------------------------------

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x000008);

const camera = new THREE.PerspectiveCamera(
    60,
    window.innerWidth / window.innerHeight,
    0.1,
    2000
);

let cameraRadius = 90;
let cameraTheta = 0;
let cameraPhi = 1.15;

const renderer = new THREE.WebGLRenderer({
    antialias: true
});

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 2)
);

renderer.outputColorSpace = THREE.SRGBColorSpace;

document.body.appendChild(renderer.domElement);

// --------------------------------
// LIGHTING
// --------------------------------

scene.add(
    new THREE.AmbientLight(0xffffff, 0.35)
);

const sunLight = new THREE.PointLight(
    0xffffff,
    1600,
    500
);

scene.add(sunLight);

// --------------------------------
// TEXTURES
// --------------------------------

const loader = new THREE.TextureLoader();

const textureURL =
'https://www.solarsystemscope.com/textures/download/';

function getTexture(filename) {

    const texture = loader.load(
        textureURL + filename
    );

    texture.colorSpace = THREE.SRGBColorSpace;

    return texture;
}

// --------------------------------
// STARS
// --------------------------------

const starPositions = [];

for(let i = 0; i < 7000; i++) {

    starPositions.push(
        (Math.random()-0.5)*700,
        (Math.random()-0.5)*450,
        (Math.random()-0.5)*700
    );
}

const starGeometry = new THREE.BufferGeometry();

starGeometry.setAttribute(
    'position',
    new THREE.Float32BufferAttribute(
        starPositions, 3
    )
);

const stars = new THREE.Points(
    starGeometry,
    new THREE.PointsMaterial({
        color: 0xffffff,
        size: 0.7
    })
);

scene.add(stars);

// --------------------------------
// GALAXY
// --------------------------------

const galaxyPositions = [];

for(let i = 0; i < 5000; i++) {

    const arm = Math.floor(Math.random()*4);

    const radius = Math.random()*65;

    const angle =
        radius*0.12 + arm*Math.PI/2;

    galaxyPositions.push(
        Math.cos(angle)*radius,
        (Math.random()-0.5)*4,
        Math.sin(angle)*radius
    );
}

const galaxyGeometry = new THREE.BufferGeometry();

galaxyGeometry.setAttribute(
    'position',
    new THREE.Float32BufferAttribute(
        galaxyPositions,3
    )
);

const galaxy = new THREE.Points(
    galaxyGeometry,
    new THREE.PointsMaterial({
        color: 0x9b91ff,
        size: 0.65,
        transparent: true,
        opacity: 0.8
    })
);

galaxy.position.set(0,-50,-100);

scene.add(galaxy);

// --------------------------------
// SUN
// --------------------------------

const sun = new THREE.Mesh(
    new THREE.SphereGeometry(5,64,64),
    new THREE.MeshBasicMaterial({
        map: getTexture('2k_sun.jpg')
    })
);

scene.add(sun);

// --------------------------------
// PLANETS
// --------------------------------

const planets = [];

const planetData = [

    ['Mercury','2k_mercury.jpg',8,0.8,
    'The smallest planet in our solar system.'],

    ['Venus','2k_venus_surface.jpg',12,1.3,
    'A very hot planet with a thick atmosphere.'],

    ['Earth','2k_earth_daymap.jpg',17,1.6,
    'Our beautiful home planet.'],

    ['Mars','2k_mars.jpg',23,1.1,
    'Mars is known as the Red Planet.'],

    ['Jupiter','2k_jupiter.jpg',32,3.5,
    'Jupiter is the largest planet.'],

    ['Saturn','2k_saturn.jpg',44,3,
    'Saturn is famous for its rings.'],

    ['Uranus','2k_uranus.jpg',55,2.2,
    'Uranus is an ice giant.'],

    ['Neptune','2k_neptune.jpg',65,2.2,
    'Neptune is a distant blue planet.']

];

planetData.forEach((data,index)=>{

    const [name,texture,distance,size,description] = data;

    const pivot = new THREE.Group();

    scene.add(pivot);

    const planet = new THREE.Mesh(
        new THREE.SphereGeometry(size,64,64),

        new THREE.MeshStandardMaterial({
            map: getTexture(texture),
            roughness: 0.9
        })
    );

    planet.position.x = distance;

    pivot.add(planet);

    planet.userData = {
        name,
        description
    };

    // EARTH CLOUDS AND ATMOSPHERE

    if(name === 'Earth') {

        const clouds = new THREE.Mesh(
            new THREE.SphereGeometry(
                size*1.015,64,64
            ),

            new THREE.MeshStandardMaterial({
                map: getTexture('2k_earth_clouds.jpg'),
                transparent: true,
                opacity: 0.65,
                depthWrite: false
            })
        );

        clouds.position.copy(planet.position);

        pivot.add(clouds);

        const atmosphere = new THREE.Mesh(
            new THREE.SphereGeometry(
                size*1.07,64,64
            ),

            new THREE.MeshBasicMaterial({
                color: 0x238cff,
                transparent: true,
                opacity: 0.14,
                side: THREE.BackSide
            })
        );

        atmosphere.position.copy(planet.position);

        pivot.add(atmosphere);

        const lights = new THREE.Mesh(
            new THREE.SphereGeometry(
                size*1.004,64,64
            ),

            new THREE.MeshBasicMaterial({
                map: getTexture('2k_earth_nightmap.jpg'),
                transparent: true,
                blending: THREE.AdditiveBlending
            })
        );

        lights.position.copy(planet.position);

        pivot.add(lights);

        planet.userData.clouds = clouds;
    }

    // SATURN RINGS

    if(name === 'Saturn') {

        const ring = new THREE.Mesh(
            new THREE.RingGeometry(
                size*1.3,
                size*2.3,
                128
            ),

            new THREE.MeshStandardMaterial({
                color: 0xc5aa83,
                side: THREE.DoubleSide,
                transparent: true,
                opacity: 0.85
            })
        );

        ring.rotation.x = -Math.PI/2.5;

        ring.position.copy(planet.position);

        pivot.add(ring);
    }

    // ORBIT PATH

    const orbit = new THREE.Mesh(
        new THREE.RingGeometry(
            distance-0.035,
            distance+0.035,
            128
        ),

        new THREE.MeshBasicMaterial({
            color: 0x394c6c,
            side: THREE.DoubleSide
        })
    );

    orbit.rotation.x = -Math.PI/2;

    scene.add(orbit);

    planets.push({
        pivot,
        planet,
        distance,
        index
    });

});

// --------------------------------
// MOON
// --------------------------------

const moon = new THREE.Mesh(
    new THREE.SphereGeometry(0.55,48,48),

    new THREE.MeshStandardMaterial({
        map: getTexture('2k_moon.jpg')
    })
);

scene.add(moon);

// --------------------------------
// SPACESHIP
// --------------------------------

const ship = new THREE.Group();

const shipBody = new THREE.Mesh(
    new THREE.ConeGeometry(0.8,3.5,16),

    new THREE.MeshStandardMaterial({
        color: 0xc5d8ed,
        metalness: 0.8,
        roughness: 0.25
    })
);

shipBody.rotation.x = Math.PI/2;

ship.add(shipBody);

const wings = new THREE.Mesh(
    new THREE.BoxGeometry(3.5,0.15,1),

    new THREE.MeshStandardMaterial({
        color: 0x587fff,
        metalness: 0.7
    })
);

ship.add(wings);

ship.position.set(0,5,12);

scene.add(ship);

let shipVisible = true;

window.moveShip = function(x,z) {

    ship.position.x += x*2;

    ship.position.z -= z*2;
};

window.toggleShip = function() {

    shipVisible = !shipVisible;

    ship.visible = shipVisible;
};

// --------------------------------
// SHOOTING STARS
// --------------------------------

const shootingStars = [];

for(let i=0;i<15;i++){

    const star = new THREE.Mesh(
        new THREE.SphereGeometry(0.12,8,8),

        new THREE.MeshBasicMaterial({
            color: 0xffffff
        })
    );

    star.position.set(
        Math.random()*140-70,
        Math.random()*60,
        Math.random()*140-70
    );

    scene.add(star);

    shootingStars.push(star);
}

// --------------------------------
// PLANET INFORMATION
// --------------------------------

const raycaster = new THREE.Raycaster();

const pointer = new THREE.Vector2();

function selectPlanet(event){

    pointer.x =
        event.clientX/window.innerWidth*2-1;

    pointer.y =
        -(event.clientY/window.innerHeight)*2+1;

    raycaster.setFromCamera(pointer,camera);

    const hits = raycaster.intersectObjects(
        planets.map(p=>p.planet)
    );

    if(hits.length){

        const data = hits[0].object.userData;

        document.getElementById(
            'planetName'
        ).textContent = data.name;

        document.getElementById(
            'planetDescription'
        ).textContent = data.description;

        document.getElementById(
            'info'
        ).style.display = 'block';
    }
}

window.closeInfo = function(){

    document.getElementById(
        'info'
    ).style.display = 'none';
};

// --------------------------------
// MOBILE AND MOUSE CONTROLS
// --------------------------------

const canvas = renderer.domElement;

const pointers = new Map();

let startX = 0;
let startY = 0;
let moved = false;

canvas.addEventListener('pointerdown',e=>{

    pointers.set(e.pointerId,{
        x:e.clientX,
        y:e.clientY
    });

    if(pointers.size===1){

        startX=e.clientX;
        startY=e.clientY;

        moved=false;
    }

    canvas.setPointerCapture(e.pointerId);
});

canvas.addEventListener('pointermove',e=>{

    if(!pointers.has(e.pointerId)) return;

    const old = pointers.get(e.pointerId);

    const dx=e.clientX-old.x;
    const dy=e.clientY-old.y;

    if(Math.abs(dx)+Math.abs(dy)>4){
        moved=true;
    }

    if(pointers.size===1){

        cameraTheta -= dx*0.005;

        cameraPhi -= dy*0.005;

        cameraPhi = THREE.MathUtils.clamp(
            cameraPhi,0.15,Math.PI-0.15
        );
    }

    if(pointers.size===2){

        const current = [...pointers.values()];

        const oldDistance = Math.hypot(
            old.x-current[0].x,
            old.y-current[0].y
        );

        const newDistance = Math.hypot(
            e.clientX-current[0].x,
            e.clientY-current[0].y
        );

        if(oldDistance>0){

            cameraRadius *=
                oldDistance/newDistance;

            cameraRadius = THREE.MathUtils.clamp(
                cameraRadius,12,180
            );
        }
    }

    pointers.set(e.pointerId,{
        x:e.clientX,
        y:e.clientY
    });
});

canvas.addEventListener('pointerup',e=>{

    if(!moved && pointers.size===1){

        selectPlanet(e);
    }

    pointers.delete(e.pointerId);
});

canvas.addEventListener('pointercancel',e=>{
    pointers.delete(e.pointerId);
});

canvas.addEventListener('wheel',e=>{

    cameraRadius += e.deltaY*0.05;

    cameraRadius = THREE.MathUtils.clamp(
        cameraRadius,12,180
    );
});

// --------------------------------
// CAMERA
// --------------------------------

function updateCamera(){

    camera.position.x =
        cameraRadius*Math.sin(cameraPhi)*
        Math.sin(cameraTheta);

    camera.position.y =
        cameraRadius*Math.cos(cameraPhi);

    camera.position.z =
        cameraRadius*Math.sin(cameraPhi)*
        Math.cos(cameraTheta);

    camera.lookAt(0,0,0);
}

// --------------------------------
// TOUR
// --------------------------------

let touring=false;

window.startTour=function(){

    touring=true;
};

window.resetView=function(){

    touring=false;

    cameraRadius=90;
    cameraTheta=0;
    cameraPhi=1.15;

    ship.position.set(0,5,12);

    document.getElementById(
        'info'
    ).style.display='none';
};

// --------------------------------
// ANIMATION
// --------------------------------

function animate(){

    requestAnimationFrame(animate);

    sun.rotation.y+=0.001;

    stars.rotation.y+=0.00003;

    galaxy.rotation.y+=0.0002;

    planets.forEach((p,i)=>{

        p.pivot.rotation.y+=0.0008+i*0.00015;

        p.planet.rotation.y+=0.003;

        if(p.planet.userData.clouds){

            p.planet.userData.clouds.rotation.y+=0.0005;
        }
    });

    // MOON ORBIT

    const earthPosition =
        new THREE.Vector3();

    planets[2].planet.getWorldPosition(
        earthPosition
    );

    const time=Date.now()*0.0005;

    moon.position.set(
        earthPosition.x+Math.cos(time)*3,
        earthPosition.y,
        earthPosition.z+Math.sin(time)*3
    );

    // SHOOTING STARS

    shootingStars.forEach(star=>{

        star.position.x-=0.25;

        star.position.y-=0.1;

        if(star.position.x < -75){

            star.position.x=75;

            star.position.y=Math.random()*60;
        }
    });

    ship.rotation.y+=0.002;

    // AUTOMATIC TOUR

    if(touring){

        cameraTheta+=0.0015;
    }

    updateCamera();

    renderer.render(scene,camera);
}

animate();

// --------------------------------
// RESIZE
// --------------------------------

window.addEventListener('resize',()=>{

    camera.aspect=
        window.innerWidth/window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );
});

document.getElementById(
    'loading'
).style.display='none';

</script>

</body>
</html>
